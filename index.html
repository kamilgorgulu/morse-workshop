<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morse Workshop</title>
<meta name="description" content="Morse Workshop — çevrimdışı Mors kodu eğitimi / offline Morse code training.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { --ink:#17201d; --paper:#f3f1ea; --coral:#c9402f; --muted:#4f5854; --mono:ui-monospace,"SF Mono",Menlo,monospace; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.legal-page { max-width:980px; margin:auto; padding:40px 6vw 100px; }
.legal-back { color:var(--ink); font:700 13px var(--mono); text-underline-offset:4px; }
.legal-page header { padding:56px 0 40px; border-bottom:1px solid #17201d33; }
.legal-page header > span { font:700 12px var(--mono); letter-spacing:.13em; color:var(--coral); }
.legal-page header h1 { margin:12px 0 0; font-size:clamp(44px,9vw,96px); line-height:.95; letter-spacing:-.04em; }
.legal-page header h1 i { font-family:Georgia,serif; font-weight:400; }
.legal-page section { padding:40px 0; border-bottom:1px solid #17201d33; }
.legal-page section h2 { font-size:30px; margin:0 0 24px; }
.legal-page section h3 { font-size:17px; margin:28px 0 8px; }
.legal-page section p { max-width:760px; line-height:1.7; color:var(--muted); font-size:16px; }
.legal-page a { color:var(--ink); font-weight:700; text-underline-offset:4px; }
.legal-links { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
.legal-icon { display:block; margin-bottom:28px; border-radius:22px; }
.legal-links a { padding:14px 18px; border:1px solid var(--ink); border-radius:12px; text-decoration:none; }
</style>
</head>
<body>
<main class="legal-page"><header><img class="legal-icon" src="apple-touch-icon.png" alt="" width="96" height="96"><span>iPHONE · iPAD</span><h1>Morse<br/><i>Workshop.</i></h1></header>
<section lang="tr"><h2>Türkçe</h2><p>Mors kodunu ritimle öğreten, çevrimdışı çalışan eğitim uygulaması.</p></section>
<section lang="en"><h2>English</h2><p>An offline app that teaches Morse code by rhythm.</p>
<div class="legal-links"><a href="privacy/">Gizlilik / Privacy</a><a href="support/">Destek / Support</a></div></section></main>
</body>
</html>
